<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090f" />
      <stop offset="50%" stop-color="#0d111c" />
      <stop offset="100%" stop-color="#121829" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <linearGradient id="accentCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5252" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f85149" stop-opacity="0.7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#58a6ff" stroke-width="0.6" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)" />

  <!-- Subtle Cyber Grid -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Outer Border with Neon Gradient -->
  <rect width="1196" height="316" x="2" y="2" rx="15" fill="none" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="160" cy="80" r="130" fill="#58a6ff" opacity="0.09" filter="url(#glow)" />
  <circle cx="1060" cy="220" r="150" fill="#f85149" opacity="0.08" filter="url(#glow)" />
  <circle cx="680" cy="160" r="100" fill="#bc8cff" opacity="0.06" filter="url(#glow)" />

  <!-- Neural Constellation Diagram on Right -->
  <g opacity="0.42">
    <line x1="860" y1="80" x2="960" y2="50" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="960" y1="50" x2="1070" y2="90" stroke="#79c0ff" stroke-width="1.4" />
    <line x1="1070" y1="90" x2="1020" y2="190" stroke="#bc8cff" stroke-width="1.4" />
    <line x1="1020" y1="190" x2="900" y2="170" stroke="#58a6ff" stroke-width="1.2" />
    <line x1="900" y1="170" x2="860" y2="80" stroke="#58a6ff" stroke-width="1.2" />
    <line x1="960" y1="50" x2="1020" y2="190" stroke="#f85149" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="900" y1="170" x2="1110" y2="210" stroke="#bc8cff" stroke-width="1.2" />
    <line x1="1070" y1="90" x2="1140" y2="60" stroke="#58a6ff" stroke-width="1.2" />

    <circle cx="860" cy="80" r="4.5" fill="#58a6ff" />
    <circle cx="960" cy="50" r="5.5" fill="#79c0ff" />
    <circle cx="1070" cy="90" r="6.5" fill="#bc8cff" />
    <circle cx="1020" cy="190" r="5.5" fill="#f85149" />
    <circle cx="900" cy="170" r="4.5" fill="#58a6ff" />
    <circle cx="1110" cy="210" r="4.5" fill="#79c0ff" />
    <circle cx="1140" cy="60" r="4" fill="#58a6ff" />
  </g>

  <!-- Status / Pill Badge -->
  <g transform="translate(60, 42)">
    <rect width="320" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#3fb950" />
    <text x="30" y="18.5" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">OPEN TO OPPORTUNITIES &amp; INTERNSHIPS</text>
  </g>

  <!-- Name -->
  <text x="60" y="124" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-1">Rishi Raj Sharma</text>

  <!-- Role Title -->
  <text x="60" y="166" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0.2">AI &amp; Product Development Engineer</text>

  <!-- Specializations Subtitle -->
  <text x="60" y="202" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
    Deep Learning Pipelines <tspan fill="#58a6ff">●</tspan> Distributed Microservices <tspan fill="#bc8cff">●</tspan> Real-Time Computer Vision Systems
  </text>

  <!-- Divider Line -->
  <line x1="60" y1="230" x2="820" y2="230" stroke="#30363d" stroke-width="1" />

  <!-- Credential Badges Row -->
  <g transform="translate(60, 248)">
    <!-- AWS CCP -->
    <rect width="180" height="32" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1" stroke-opacity="0.7" />
    <text x="14" y="20.5" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">☁️ AWS Certified CP</text>

    <!-- JPMC -->
    <g transform="translate(196, 0)">
      <rect width="195" height="32" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.7" />
      <text x="14" y="20.5" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🏛️ JPMC Software Eng</text>
    </g>

    <!-- BITM -->
    <g transform="translate(407, 0)">
      <rect width="185" height="32" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1" stroke-opacity="0.7" />
      <text x="14" y="20.5" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🎓 BITM CSE (AI) '27</text>
    </g>

    <!-- Live Portfolio -->
    <g transform="translate(608, 0)">
      <rect width="190" height="32" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1" stroke-opacity="0.8" />
      <text x="14" y="20.5" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🌐 Live Portfolio ↗</text>
    </g>
  </g>
</svg>