<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#141a2e" />
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8957e5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f85149" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" />

  <!-- Subtle Cyber Grid -->
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />

  <!-- Outer Border with Gradient -->
  <rect width="1196" height="336" x="2" y="2" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="80" r="140" fill="#388bfd" opacity="0.08" filter="url(#glow)" />
  <circle cx="1080" cy="240" r="160" fill="#f85149" opacity="0.07" filter="url(#glow)" />
  <circle cx="650" cy="170" r="120" fill="#8957e5" opacity="0.06" filter="url(#glow)" />

  <!-- Neural Net Constellation Graphics on the Right -->
  <g opacity="0.35">
    <line x1="880" y1="90" x2="980" y2="60" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="980" y1="60" x2="1080" y2="110" stroke="#79c0ff" stroke-width="1.2" />
    <line x1="1080" y1="110" x2="1030" y2="200" stroke="#bc8cff" stroke-width="1.2" />
    <line x1="1030" y1="200" x2="920" y2="180" stroke="#58a6ff" stroke-width="1.2" />
    <line x1="920" y1="180" x2="880" y2="90" stroke="#58a6ff" stroke-width="1.2" />
    <line x1="980" y1="60" x2="1030" y2="200" stroke="#f85149" stroke-width="1.2" stroke-opacity="0.7" />
    <line x1="920" y1="180" x2="1110" y2="220" stroke="#bc8cff" stroke-width="1.2" />
    <line x1="1080" y1="110" x2="1140" y2="70" stroke="#58a6ff" stroke-width="1.2" />

    <circle cx="880" cy="90" r="4" fill="#58a6ff" />
    <circle cx="980" cy="60" r="5" fill="#79c0ff" />
    <circle cx="1080" cy="110" r="6" fill="#bc8cff" />
    <circle cx="1030" cy="200" r="5" fill="#f85149" />
    <circle cx="920" cy="180" r="4" fill="#58a6ff" />
    <circle cx="1110" cy="220" r="4" fill="#79c0ff" />
    <circle cx="1140" cy="70" r="3.5" fill="#58a6ff" />
  </g>

  <!-- Status / Pill Badge -->
  <g transform="translate(60, 48)">
    <rect width="320" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#3fb950" />
    <text x="30" y="18.5" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">OPEN TO OPPORTUNITIES &amp; INTERNSHIPS</text>
  </g>

  <!-- Main Name -->
  <text x="60" y="132" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Rishi Raj Sharma</text>

  <!-- Title / Specialization -->
  <text x="60" y="176" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.2">AI &amp; Product Development Engineer</text>

  <!-- Subtitle / Focus Areas -->
  <text x="60" y="214" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Deep Learning Pipelines <tspan fill="#58a6ff">●</tspan> Distributed Microservices <tspan fill="#bc8cff">●</tspan> Real-Time Computer Vision Systems
  </text>

  <!-- Decorative Separator Line -->
  <line x1="60" y1="246" x2="820" y2="246" stroke="#30363d" stroke-width="1" />

  <!-- Key Badges at Bottom -->
  <g transform="translate(60, 266)">
    <!-- Badge 1: AWS CCP -->
    <rect width="185" height="30" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1" stroke-opacity="0.6" />
    <text x="12" y="19.5" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">☁️ AWS Certified CP</text>

    <!-- Badge 2: JPMorgan Chase Simulation -->
    <g transform="translate(200, 0)">
      <rect width="185" height="30" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.6" />
      <text x="12" y="19.5" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🏛️ JPMC Software Eng</text>
    </g>

    <!-- Badge 3: BITM CSE-AI -->
    <g transform="translate(400, 0)">
      <rect width="180" height="30" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1" stroke-opacity="0.6" />
      <text x="12" y="19.5" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🎓 BITM CSE (AI) '27</text>
    </g>

    <!-- Badge 4: Live Portfolio -->
    <g transform="translate(595, 0)">
      <rect width="185" height="30" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1" stroke-opacity="0.6" />
      <text x="12" y="19.5" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🌐 Live Portfolio ↗</text>
    </g>
  </g>
</svg>