<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <style>
      @keyframes softBreathe {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.08); }
      }
      @keyframes borderGlow {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.7; }
      }
      @keyframes beaconPing {
        0% { r: 3.5px; opacity: 1; }
        50% { r: 8px; opacity: 0; }
        100% { r: 3.5px; opacity: 0; }
      }
      .ambient-glow {
        animation: softBreathe 6s ease-in-out infinite;
        transform-origin: 600px 140px;
      }
      .beacon {
        animation: beaconPing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .border-line {
        animation: borderGlow 4s ease-in-out infinite;
      }
    </style>

    <!-- Deep Minimalist Slate Gradients -->
    <linearGradient id="bgSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <!-- Subtle Radial Accent -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#1f6feb" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Minimal Dot Matrix Grid -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#8b949e" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="1200" height="280" rx="16" fill="url(#bgSlate)" />

  <!-- Dot Matrix Grid Overlay -->
  <rect width="1200" height="280" rx="16" fill="url(#dotGrid)" />

  <!-- Soft Ambient Glow (Centered, Breathing) -->
  <circle cx="600" cy="140" r="260" fill="url(#centerGlow)" class="ambient-glow" />

  <!-- Subtle Outer Border -->
  <rect width="1196" height="276" x="2" y="2" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" class="border-line" />

  <!-- Center-Aligned Content Layout -->
  <g text-anchor="middle" transform="translate(600, 0)">

    <!-- Top Status Badge -->
    <g transform="translate(0, 42)">
      <rect x="-140" y="0" width="280" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <!-- Animated Beacon -->
      <circle cx="-116" cy="14" r="3.5" fill="none" stroke="#3fb950" stroke-width="1.5" class="beacon" />
      <circle cx="-116" cy="14" r="3.5" fill="#3fb950" />
      <text x="10" y="18" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6">AI &amp; PRODUCT DEVELOPMENT</text>
    </g>

    <!-- Candidate Main Name -->
    <text y="122" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Rishi Raj Sharma</text>

    <!-- Subtitle / Focus Areas -->
    <text y="160" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Deep Learning Pipelines &#183; Distributed Microservices &#183; Real-Time Vision Systems
    </text>

    <!-- Minimal Separator Line -->
    <line x1="-320" y1="190" x2="320" y2="190" stroke="#30363d" stroke-width="1" />

    <!-- Clean Credential Badges -->
    <g transform="translate(0, 214)">
      <!-- Badge 1: AWS -->
      <g transform="translate(-300, 0)">
        <rect x="0" y="0" width="180" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="90" y="19" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">&#9729; AWS Certified CP</text>
      </g>

      <!-- Badge 2: JPMC -->
      <g transform="translate(-105, 0)">
        <rect x="0" y="0" width="195" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="97.5" y="19" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">&#127963; JPMC Software Eng</text>
      </g>

      <!-- Badge 3: BITM -->
      <g transform="translate(105, 0)">
        <rect x="0" y="0" width="195" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="97.5" y="19" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">&#127891; BITM CSE (AI) '27</text>
      </g>
    </g>

  </g>
</svg>