<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <style>
      /* Smooth continuous laser flows from center to edges */
      @keyframes beamFlowOutRight {
        0% { stroke-dashoffset: 600; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes beamFlowOutLeft {
        0% { stroke-dashoffset: -600; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes centerPulseSweep {
        0% { stroke-dashoffset: 500; opacity: 0.2; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: -500; opacity: 0.2; }
      }
      @keyframes blueCoreBreathe {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.15); }
      }
      @keyframes beaconPing {
        0% { r: 3.5px; opacity: 1; }
        50% { r: 9px; opacity: 0; }
        100% { r: 3.5px; opacity: 0; }
      }
      @keyframes borderGlowPulse {
        0%, 100% { stroke-opacity: 0.25; }
        50% { stroke-opacity: 0.7; }
      }

      .top-left-beam {
        stroke-dasharray: 120 280;
        animation: beamFlowOutLeft 3s linear infinite;
      }
      .top-right-beam {
        stroke-dasharray: 120 280;
        animation: beamFlowOutRight 3s linear infinite;
      }
      .bottom-left-beam {
        stroke-dasharray: 120 280;
        animation: beamFlowOutLeft 3s linear infinite;
      }
      .bottom-right-beam {
        stroke-dasharray: 120 280;
        animation: beamFlowOutRight 3s linear infinite;
      }
      .center-pulse-left {
        stroke-dasharray: 90 200;
        animation: beamFlowOutLeft 2.5s linear infinite;
      }
      .center-pulse-right {
        stroke-dasharray: 90 200;
        animation: beamFlowOutRight 2.5s linear infinite;
      }
      .blue-aura {
        animation: blueCoreBreathe 4.5s ease-in-out infinite;
        transform-origin: 600px 140px;
      }
      .beacon-dot {
        animation: beaconPing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .base-border {
        animation: borderGlowPulse 4s ease-in-out infinite;
      }
    </style>

    <!-- Electric Blue Gradient -->
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Subtitle Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Intense Central Blue Glow Bloom -->
    <radialGradient id="centerBlueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e3a8a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Side Accent Glows -->
    <radialGradient id="sideGlowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sideGlowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- High-Impact Neon Laser Glow Filter -->
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Blue Circuit Grid -->
    <pattern id="blueGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#00d2ff" opacity="0.15" />
    </pattern>
  </defs>

  <!-- PURE BLACK CANVAS -->
  <rect width="1200" height="280" rx="16" fill="#030407" />

  <!-- Subtle Blue Grid Texture -->
  <rect width="1200" height="280" rx="16" fill="url(#blueGrid)" />

  <!-- Ambient Blue Lighting In Black Canvas -->
  <circle cx="160" cy="140" r="220" fill="url(#sideGlowLeft)" />
  <circle cx="1040" cy="140" r="220" fill="url(#sideGlowRight)" />
  <circle cx="600" cy="138" r="300" fill="url(#centerBlueGlow)" class="blue-aura" />

  <!-- Base Border -->
  <rect width="1196" height="276" x="2" y="2" rx="15" fill="none" stroke="#0284c7" stroke-width="1.2" class="base-border" />

  <!-- ================= TOP BLUE ANIMATED BEAMS (CENTER TO SIDEWAYS) ================= -->
  <!-- Top Left: 600 -> 20 -->
  <path d="M 600 2 L 20 2" fill="none" stroke="#00f2fe" stroke-width="2.5" class="top-left-beam" filter="url(#laserGlow)" />
  <!-- Top Right: 600 -> 1180 -->
  <path d="M 600 2 L 1180 2" fill="none" stroke="#00f2fe" stroke-width="2.5" class="top-right-beam" filter="url(#laserGlow)" />
  <!-- Center Top Emitter Node -->
  <circle cx="600" cy="2" r="3.5" fill="#ffffff" filter="url(#laserGlow)" />

  <!-- ================= BOTTOM BLUE ANIMATED BEAMS (CENTER TO SIDEWAYS) ================= -->
  <!-- Bottom Left: 600 -> 20 -->
  <path d="M 600 278 L 20 278" fill="none" stroke="#00f2fe" stroke-width="2.5" class="bottom-left-beam" filter="url(#laserGlow)" />
  <!-- Bottom Right: 600 -> 1180 -->
  <path d="M 600 278 L 1180 278" fill="none" stroke="#00f2fe" stroke-width="2.5" class="bottom-right-beam" filter="url(#laserGlow)" />
  <!-- Center Bottom Emitter Node -->
  <circle cx="600" cy="278" r="3.5" fill="#ffffff" filter="url(#laserGlow)" />

  <!-- ================= CENTER LINE BEAMS (FLOWING SIDEWAYS) ================= -->
  <line x1="160" y1="190" x2="1040" y2="190" stroke="#0f172a" stroke-width="1" />
  <!-- Left Sweep -->
  <path d="M 600 190 L 160 190" fill="none" stroke="url(#electricBlue)" stroke-width="2" class="center-pulse-left" filter="url(#laserGlow)" />
  <!-- Right Sweep -->
  <path d="M 600 190 L 1040 190" fill="none" stroke="url(#electricBlue)" stroke-width="2" class="center-pulse-right" filter="url(#laserGlow)" />
  <!-- Center Origin Core -->
  <circle cx="600" cy="190" r="3.5" fill="#00f2fe" filter="url(#laserGlow)" />

  <!-- ================= CENTERED CONTENT ================= -->
  <g text-anchor="middle" transform="translate(600, 0)">

    <!-- Top Status Badge -->
    <g transform="translate(0, 42)">
      <rect x="-145" y="0" width="290" height="28" rx="14" fill="#000000" stroke="#0284c7" stroke-width="1.2" />
      <!-- Animated Beacon -->
      <circle cx="-120" cy="14" r="3.5" fill="none" stroke="#00f2fe" stroke-width="1.5" class="beacon-dot" />
      <circle cx="-120" cy="14" r="3.5" fill="#00f2fe" />
      <text x="12" y="18.5" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.6">AI &amp; PRODUCT DEVELOPMENT</text>
    </g>

    <!-- Main Name -->
    <text y="122" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">Rishi Raj Sharma</text>

    <!-- Subtitle with Cyan Gradient -->
    <text y="160" fill="url(#cyanGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="600" letter-spacing="0.2">
      Deep Learning Pipelines &#183; Distributed Microservices &#183; Real-Time Vision Systems
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 216)">
      <!-- Badge 1: AWS -->
      <g transform="translate(-300, 0)">
        <rect x="0" y="0" width="180" height="30" rx="6" fill="#000000" stroke="#0284c7" stroke-width="1.2" />
        <text x="90" y="19.5" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">&#9729; AWS Certified CP</text>
      </g>

      <!-- Badge 2: JPMC -->
      <g transform="translate(-105, 0)">
        <rect x="0" y="0" width="195" height="30" rx="6" fill="#000000" stroke="#0284c7" stroke-width="1.2" />
        <text x="97.5" y="19.5" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">&#127963; JPMC Software Eng</text>
      </g>

      <!-- Badge 3: BITM -->
      <g transform="translate(105, 0)">
        <rect x="0" y="0" width="195" height="30" rx="6" fill="#000000" stroke="#0284c7" stroke-width="1.2" />
        <text x="97.5" y="19.5" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">&#127891; BITM CSE (AI) '27</text>
      </g>
    </g>

  </g>
</svg>