<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <style>
      @keyframes auroraPulse {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
        50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.75; }
      }
      @keyframes waveSlide {
        0% { transform: translateX(0); }
        100% { transform: translateX(-400px); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pingRadar {
        0% { r: 4px; opacity: 1; stroke-width: 1px; }
        50% { r: 10px; opacity: 0; stroke-width: 2px; }
        100% { r: 4px; opacity: 0; stroke-width: 1px; }
      }
      @keyframes telemetryFlow {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes barPulse1 {
        0%, 100% { height: 18px; y: 46px; }
        50% { height: 42px; y: 22px; }
      }
      @keyframes barPulse2 {
        0%, 100% { height: 35px; y: 29px; }
        50% { height: 14px; y: 50px; }
      }
      @keyframes barPulse3 {
        0%, 100% { height: 48px; y: 16px; }
        50% { height: 26px; y: 38px; }
      }
      @keyframes barPulse4 {
        0%, 100% { height: 22px; y: 42px; }
        50% { height: 50px; y: 14px; }
      }
      @keyframes cardFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes glowBorder {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.85; }
      }

      .aurora-bg { animation: auroraPulse 8s ease-in-out infinite; transform-origin: 900px 180px; }
      .radar-ping { animation: pingRadar 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .cursor { animation: cursorBlink 1s infinite; }
      .data-stream { stroke-dasharray: 12 18; animation: telemetryFlow 2.5s linear infinite; }
      .data-stream-rev { stroke-dasharray: 10 20; animation: telemetryFlow 3s linear infinite reverse; }
      .floating-deck { animation: cardFloat 5s ease-in-out infinite; }
      .border-pulse { animation: glowBorder 4s ease-in-out infinite; }
      .bar-1 { animation: barPulse1 1.2s ease-in-out infinite; }
      .bar-2 { animation: barPulse2 1.5s ease-in-out infinite; }
      .bar-3 { animation: barPulse3 0.9s ease-in-out infinite; }
      .bar-4 { animation: barPulse4 1.4s ease-in-out infinite; }
    </style>

    <!-- Deep Designer Gradients -->
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Sleek Neon Cyan to Violet Shimmer -->
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Amber Glow -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Aurora Radial Bloom -->
    <radialGradient id="auroraCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Carbon Grid Texture -->
    <pattern id="carbonGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.06" />
      <circle cx="28" cy="28" r="0.65" fill="#38bdf8" opacity="0.12" />
    </pattern>

    <!-- Glassmorphic Card Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="360" rx="16" fill="url(#deckBg)" />

  <!-- Nano Carbon Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#carbonGrid)" />

  <!-- Aurora Atmospheric Backing Lights (Animated) -->
  <g class="aurora-bg">
    <circle cx="950" cy="140" r="220" fill="url(#auroraCyan)" />
    <circle cx="1080" cy="220" r="180" fill="url(#auroraViolet)" />
    <circle cx="450" cy="80" r="140" fill="url(#auroraCyan)" opacity="0.5" />
  </g>

  <!-- Outer Glass Frame with Pulsing Glow Border -->
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.2" class="border-pulse" />

  <!-- ================= LEFT COLUMN: CANDIDATE IDENTITY ================= -->

  <!-- Live Pulse Pill -->
  <g transform="translate(56, 42)">
    <rect width="285" height="28" rx="14" fill="#0c1322" stroke="#1e293b" stroke-width="1" />
    <!-- Outer radar ping -->
    <circle cx="16" cy="14" r="5" fill="none" stroke="#10b981" class="radar-ping" />
    <!-- Inner solid dot -->
    <circle cx="16" cy="14" r="3.5" fill="#10b981" />
    <text x="30" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6">READY FOR ROLES &#183; 2026&#8211;2027</text>
  </g>

  <!-- Primary Name Heading -->
  <text x="56" y="122" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="800" letter-spacing="-0.8">Rishi Raj Sharma</text>

  <!-- Role Subtitle with Radiant Gradient -->
  <text x="56" y="162" fill="url(#cyanViolet)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.2">AI &amp; Product Development Engineer</text>

  <!-- Interactive Terminal Prompt Chip -->
  <g transform="translate(56, 184)">
    <rect width="470" height="34" rx="8" fill="#05070d" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="17" r="3.5" fill="#ef4444" />
    <circle cx="28" cy="17" r="3.5" fill="#f59e0b" />
    <circle cx="40" cy="17" r="3.5" fill="#10b981" />
    <text x="56" y="22" fill="#38bdf8" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="12" font-weight="500">&gt; ai.system: <tspan fill="#f1f5f9">DistilRoBERTa</tspan> &#183; <tspan fill="#10b981">&lt;140ms</tspan> &#183; <tspan fill="#a855f7">30 FPS</tspan></text>
    <rect x="375" y="11" width="7" height="13" fill="#38bdf8" class="cursor" />
  </g>

  <!-- Credential Badges Row -->
  <g transform="translate(56, 238)">
    <text x="0" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500">
      Deep Learning Pipelines &#183; Spring Cloud Microservices &#183; Real-Time Vision
    </text>
  </g>

  <!-- Lower Verified Badges Row -->
  <g transform="translate(56, 274)">
    <!-- AWS Certified CP -->
    <rect width="168" height="32" rx="6" fill="#0c1322" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.8" />
    <text x="12" y="20" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">&#9729; AWS Certified CP</text>

    <!-- JPMC Simulation -->
    <g transform="translate(178, 0)">
      <rect width="178" height="32" rx="6" fill="#0c1322" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8" />
      <text x="12" y="20" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">&#127963; JPMC Software Eng</text>
    </g>

    <!-- BITM Ballari -->
    <g transform="translate(366, 0)">
      <rect width="160" height="32" rx="6" fill="#0c1322" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.8" />
      <text x="12" y="20" fill="#ede9fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">&#127891; BITM CSE-AI '27</text>
    </g>

    <!-- Live Portfolio -->
    <g transform="translate(536, 0)">
      <rect width="160" height="32" rx="6" fill="#0c1322" stroke="#10b981" stroke-width="1" stroke-opacity="0.9" />
      <text x="12" y="20" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">&#127760; Live Portfolio &#8599;</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: INTERACTIVE DEV CONTROL DECK ================= -->

  <g class="floating-deck" transform="translate(730, 42)">

    <!-- Main Glass Control Card -->
    <rect width="414" height="268" rx="14" fill="#070c16" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" filter="url(#boxShadow)" />

    <!-- Card Header / Titlebar -->
    <rect width="414" height="36" rx="14" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
    <circle cx="18" cy="18" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="32" cy="18" r="4" fill="#f59e0b" opacity="0.8" />
    <circle cx="46" cy="18" r="4" fill="#10b981" opacity="0.8" />
    <text x="64" y="22" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">ENGINEERING_TELEMETRY.LIVE</text>
    <rect x="330" y="10" width="70" height="16" rx="8" fill="#10b981" fill-opacity="0.15" />
    <circle cx="340" cy="18" r="2.5" fill="#10b981" />
    <text x="348" y="21.5" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">30 FPS</text>

    <!-- Sub-Module 1: Real-time Audio/Vision Spectrum Analyzer -->
    <g transform="translate(20, 52)">
      <rect width="180" height="96" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">CNN VISION LOOP</text>
      <text x="14" y="38" fill="#64748b" font-family="'Fira Code', monospace" font-size="9.5">Webcam &#8594; Streamlit</text>

      <!-- Equalizer / Waveform frequency bars -->
      <g transform="translate(14, 20)">
        <rect x="0" width="5" rx="2" fill="#00e5ff" class="bar-1" />
        <rect x="9" width="5" rx="2" fill="#38bdf8" class="bar-2" />
        <rect x="18" width="5" rx="2" fill="#818cf8" class="bar-3" />
        <rect x="27" width="5" rx="2" fill="#a855f7" class="bar-4" />
        <rect x="36" width="5" rx="2" fill="#00e5ff" class="bar-2" />
        <rect x="45" width="5" rx="2" fill="#38bdf8" class="bar-1" />
        <rect x="54" width="5" rx="2" fill="#818cf8" class="bar-4" />
        <rect x="63" width="5" rx="2" fill="#a855f7" class="bar-3" />
        <rect x="72" width="5" rx="2" fill="#00e5ff" class="bar-1" />
        <rect x="81" width="5" rx="2" fill="#38bdf8" class="bar-2" />
        <rect x="90" width="5" rx="2" fill="#818cf8" class="bar-4" />
        <rect x="99" width="5" rx="2" fill="#a855f7" class="bar-3" />
        <rect x="108" width="5" rx="2" fill="#00e5ff" class="bar-2" />
        <rect x="117" width="5" rx="2" fill="#38bdf8" class="bar-1" />
        <rect x="126" width="5" rx="2" fill="#818cf8" class="bar-3" />
        <rect x="135" width="5" rx="2" fill="#a855f7" class="bar-4" />
      </g>
      <text x="14" y="86" fill="#10b981" font-family="'Fira Code', monospace" font-size="10" font-weight="600">&#9679; INFERENCE: ACTIVE</text>
    </g>

    <!-- Sub-Module 2: Microservices Topology Deck -->
    <g transform="translate(214, 52)">
      <rect width="180" height="96" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="22" fill="#8b5cf6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">SPRING CLOUD</text>
      <text x="14" y="38" fill="#64748b" font-family="'Fira Code', monospace" font-size="9.5">Gateway: 9191 &#183; Zipkin</text>

      <!-- Architecture microservices nodes -->
      <g transform="translate(14, 48)">
        <rect width="40" height="18" rx="4" fill="#1e293b" />
        <text x="6" y="13" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="8">Eureka</text>

        <!-- Connecting animated data stream -->
        <line x1="40" y1="9" x2="72" y2="9" stroke="#8b5cf6" stroke-width="1.8" class="data-stream" />

        <rect x="72" width="76" height="18" rx="4" fill="#1e293b" />
        <text x="78" y="13" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="8">WebClient</text>
      </g>
      <text x="14" y="86" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="10" font-weight="600">&#9679; TRACE: 100% OK</text>
    </g>

    <!-- Sub-Module 3: NLP Benchmark Pipeline Strip -->
    <g transform="translate(20, 160)">
      <rect width="374" height="88" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="22" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">NEWSROOM AI PIPELINE (LATENCY BENCHMARK)</text>
      <text x="16" y="40" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9.5">Multi-API Stream &#8594; DistilRoBERTa &#8594; Gemini &#8594; MongoDB</text>

      <!-- Latency Progress Bar Indicator -->
      <g transform="translate(16, 50)">
        <rect width="342" height="6" rx="3" fill="#1e293b" />
        <rect width="280" height="6" rx="3" fill="url(#cyanViolet)" />
      </g>
      <text x="16" y="74" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10" font-weight="700">LATENCY: &lt; 140ms</text>
      <text x="245" y="74" fill="#10b981" font-family="'Fira Code', monospace" font-size="10" font-weight="600">7 EMOTION VECTORS</text>
    </g>
  </g>
</svg>