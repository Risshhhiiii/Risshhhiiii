<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 15px rgba(88, 166, 255, 0.4)); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 25px rgba(248, 81, 73, 0.7)); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 240; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes textShine {
        0% { stop-color: #58a6ff; }
        33% { stop-color: #bc8cff; }
        66% { stop-color: #ff7b72; }
        100% { stop-color: #58a6ff; }
      }
      @keyframes ping {
        0% { r: 4px; opacity: 1; stroke-width: 1px; }
        50% { r: 9px; opacity: 0.3; stroke-width: 2px; }
        100% { r: 4px; opacity: 1; stroke-width: 1px; }
      }
      @keyframes borderRotate {
        0% { stroke: #58a6ff; }
        33% { stroke: #bc8cff; }
        66% { stroke: #f85149; }
        100% { stroke: #58a6ff; }
      }
      .node-pulse { animation: pulseGlow 3s ease-in-out infinite; }
      .laser-line { stroke-dasharray: 20 60; animation: dashFlow 3s linear infinite; }
      .laser-line-fast { stroke-dasharray: 15 45; animation: dashFlow 2s linear infinite reverse; }
      .floating-constellation { animation: floatSlow 6s ease-in-out infinite; transform-origin: 1000px 180px; }
      .floating-orb { animation: floatReverse 8s ease-in-out infinite; }
      .live-ping { animation: ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .title-gradient-1 { animation: textShine 6s infinite linear; }
      .border-animated { animation: borderRotate 8s linear infinite; }
    </style>

    <!-- Deep Cyber Space Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="40%" stop-color="#0a0f1d" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Dynamic Animated Name Gradient -->
    <linearGradient id="animatedNameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" class="title-gradient-1" />
      <stop offset="50%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>

    <!-- Tsukuyomi Red Core Glow -->
    <radialGradient id="tsukuyomiEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#b30000" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glassmorphic Grid Pattern -->
    <pattern id="nanoGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#388bfd" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="30" cy="30" r="0.75" fill="#58a6ff" opacity="0.15" />
    </pattern>

    <!-- Blur Filters -->
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#cyberBg)" />

  <!-- Nano Cyber Grid -->
  <rect width="1200" height="360" rx="20" fill="url(#nanoGrid)" />

  <!-- Ambient Glowing Nebulae -->
  <circle cx="180" cy="90" r="160" fill="#388bfd" opacity="0.12" filter="url(#laserGlow)" class="floating-orb" />
  <circle cx="1060" cy="200" r="180" fill="#f85149" opacity="0.12" filter="url(#laserGlow)" class="floating-orb" />
  <circle cx="650" cy="180" r="130" fill="#8957e5" opacity="0.08" filter="url(#laserGlow)" />

  <!-- Glowing Frame Border -->
  <rect width="1194" height="354" x="3" y="3" rx="18" fill="none" class="border-animated" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Animated Neural / Constellation Mesh on the Right -->
  <g class="floating-constellation">
    <!-- Red Tsukuyomi Aura Center -->
    <circle cx="1010" cy="170" r="110" fill="url(#tsukuyomiEye)" />

    <!-- Connecting Neural Laser Beams -->
    <line x1="840" y1="120" x2="940" y2="70" stroke="#30363d" stroke-width="1.5" />
    <line x1="840" y1="120" x2="940" y2="70" stroke="#58a6ff" stroke-width="2" class="laser-line" filter="url(#laserGlow)" />

    <line x1="940" y1="70" x2="1080" y2="100" stroke="#30363d" stroke-width="1.5" />
    <line x1="940" y1="70" x2="1080" y2="100" stroke="#bc8cff" stroke-width="2" class="laser-line-fast" filter="url(#laserGlow)" />

    <line x1="1080" y1="100" x2="1020" y2="230" stroke="#30363d" stroke-width="1.5" />
    <line x1="1080" y1="100" x2="1020" y2="230" stroke="#ff7b72" stroke-width="2" class="laser-line" filter="url(#laserGlow)" />

    <line x1="1020" y1="230" x2="890" y2="210" stroke="#30363d" stroke-width="1.5" />
    <line x1="1020" y1="230" x2="890" y2="210" stroke="#58a6ff" stroke-width="2" class="laser-line-fast" filter="url(#laserGlow)" />

    <line x1="890" y1="210" x2="840" y2="120" stroke="#30363d" stroke-width="1.5" />
    <line x1="890" y1="210" x2="840" y2="120" stroke="#79c0ff" stroke-width="2" class="laser-line" filter="url(#laserGlow)" />

    <line x1="940" y1="70" x2="1020" y2="230" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
    <line x1="890" y1="210" x2="1120" y2="240" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
    <line x1="1080" y1="100" x2="1140" y2="80" stroke="#58a6ff" stroke-width="1.5" />

    <!-- Glowing Synapse Nodes -->
    <circle cx="840" cy="120" r="5" fill="#58a6ff" class="node-pulse" />
    <circle cx="940" cy="70" r="6" fill="#79c0ff" class="node-pulse" />
    <circle cx="1080" cy="100" r="7" fill="#bc8cff" class="node-pulse" />
    <circle cx="1020" cy="230" r="8" fill="#f85149" class="node-pulse" filter="url(#laserGlow)" />
    <circle cx="890" cy="210" r="5" fill="#58a6ff" class="node-pulse" />
    <circle cx="1120" cy="240" r="5" fill="#bc8cff" class="node-pulse" />
    <circle cx="1140" cy="80" r="4" fill="#58a6ff" class="node-pulse" />

    <!-- Inner Core Eye Geometry (Tsukuyomi Tomoe Accent) -->
    <circle cx="1020" cy="230" r="16" fill="none" stroke="#ff4d4d" stroke-width="1.5" opacity="0.7" stroke-dasharray="8 6" />
    <circle cx="1080" cy="100" r="14" fill="none" stroke="#bc8cff" stroke-width="1.2" opacity="0.6" stroke-dasharray="6 4" />
  </g>

  <!-- Status / Pill Badge with Animated Heartbeat Ping -->
  <g transform="translate(60, 44)">
    <rect width="320" height="30" rx="15" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <!-- Outer Ping Circle -->
    <circle cx="18" cy="15" r="7" fill="none" stroke="#3fb950" class="live-ping" />
    <!-- Inner Solid Dot -->
    <circle cx="18" cy="15" r="4.5" fill="#3fb950" />
    <text x="34" y="19.5" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">OPEN TO OPPORTUNITIES &amp; INTERNSHIPS</text>
  </g>

  <!-- Main Engineer Name with Animated Chromatic Glow -->
  <g transform="translate(60, 134)">
    <text x="0" y="0" fill="url(#animatedNameGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">Rishi Raj Sharma</text>
  </g>

  <!-- Professional Role Subtitle -->
  <text x="60" y="178" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.2">AI &amp; Product Development Engineer</text>

  <!-- Technical Domain Pills -->
  <text x="60" y="214" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
    <tspan fill="#58a6ff" font-weight="600">● Deep Learning Pipelines</tspan> &#160;·&#160; 
    <tspan fill="#bc8cff" font-weight="600">● Distributed Microservices</tspan> &#160;·&#160; 
    <tspan fill="#ff7b72" font-weight="600">● Real-Time Vision Systems</tspan>
  </text>

  <!-- Horizontal Tech Separator Line with Center Glow Spot -->
  <line x1="60" y1="244" x2="800" y2="244" stroke="#21262d" stroke-width="1.5" />
  <line x1="60" y1="244" x2="350" y2="244" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Interactive / Sleek Badges at Bottom -->
  <g transform="translate(60, 266)">
    <!-- Badge 1: AWS CCP -->
    <g>
      <rect width="180" height="34" rx="8" fill="#161b22" stroke="#d97706" stroke-width="1.2" />
      <text x="14" y="21.5" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">☁️ AWS Certified CP</text>
    </g>

    <!-- Badge 2: JPMorgan Chase Simulation -->
    <g transform="translate(194, 0)">
      <rect width="195" height="34" rx="8" fill="#161b22" stroke="#2563eb" stroke-width="1.2" />
      <text x="14" y="21.5" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">🏛️ JPMC Software Eng</text>
    </g>

    <!-- Badge 3: BITM CSE-AI -->
    <g transform="translate(403, 0)">
      <rect width="185" height="34" rx="8" fill="#161b22" stroke="#7c3aed" stroke-width="1.2" />
      <text x="14" y="21.5" fill="#ede9fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">🎓 BITM CSE (AI) '27</text>
    </g>

    <!-- Badge 4: Live Portfolio -->
    <g transform="translate(602, 0)">
      <rect width="192" height="34" rx="8" fill="#161b22" stroke="#059669" stroke-width="1.5" />
      <circle cx="20" cy="17" r="4" fill="#10b981" />
      <text x="32" y="21.5" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">🌐 Live Portfolio ↗</text>
    </g>
  </g>
</svg>